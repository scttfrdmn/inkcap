# GoReleaser configuration for inkcap.
# Docs: https://goreleaser.com
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: inkcap
    main: ./cmd/inkcap
    binary: inkcap
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows on arm64 isn't a target we care to ship.
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: inkcap
    formats: [tar.gz]
    # Use zip for Windows.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

nfpms:
  - id: inkcap
    package_name: inkcap
    vendor: Scott Friedman
    homepage: https://github.com/scttfrdmn/inkcap
    maintainer: Scott Friedman <3011922+scttfrdmn@users.noreply.github.com>
    description: Markdown to typeset PDF in one static binary.
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    # Version-less file names, so releases/latest/download/<name> in the README
    # stays valid across releases. The package metadata still carries the version.
    file_name_template: "{{ .PackageName }}_{{ .Os }}_{{ .Arch }}"

# Classic per-arch docker builds + a manifest. dockers_v2 was tried but its
# multi-platform build context did not stage the binary for the COPY, so the
# image build failed; this proven form builds each arch from its own GOOS/GOARCH
# artifact and then stitches a multi-arch manifest.
dockers:
  - id: inkcap-amd64
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    use: buildx
    image_templates:
      - "ghcr.io/scttfrdmn/inkcap:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/scttfrdmn/inkcap"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"
  - id: inkcap-arm64
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    use: buildx
    image_templates:
      - "ghcr.io/scttfrdmn/inkcap:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/scttfrdmn/inkcap"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"

docker_manifests:
  - name_template: "ghcr.io/scttfrdmn/inkcap:{{ .Version }}"
    image_templates:
      - "ghcr.io/scttfrdmn/inkcap:{{ .Version }}-amd64"
      - "ghcr.io/scttfrdmn/inkcap:{{ .Version }}-arm64"
  - name_template: "ghcr.io/scttfrdmn/inkcap:latest"
    skip_push: auto # prereleases don't move :latest
    image_templates:
      - "ghcr.io/scttfrdmn/inkcap:{{ .Version }}-amd64"
      - "ghcr.io/scttfrdmn/inkcap:{{ .Version }}-arm64"

# Developer ID signing + notarization of the darwin binaries, on ubuntu via
# quill. Gated on the secret so forks and --snapshot builds still work; because
# of that gate, release.yml fails explicitly when any MACOS_* secret is missing,
# or goreleaser would silently skip signing and still succeed.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - inkcap
      sign:
        certificate: '{{ .Env.MACOS_SIGN_P12 }}'   # base64 .p12 (Developer ID Application + key)
        password: '{{ .Env.MACOS_SIGN_PASSWORD }}'
      notarize:
        issuer_id: '{{ .Env.MACOS_NOTARY_ISSUER_ID }}'
        key_id: '{{ .Env.MACOS_NOTARY_KEY_ID }}'
        key: '{{ .Env.MACOS_NOTARY_KEY }}'         # base64 .p8 (App Store Connect API key)
        wait: true    # don't ship while Apple's verdict is pending
        timeout: 20m  # goreleaser's ceiling

homebrew_casks:
  - name: inkcap
    repository:
      owner: scttfrdmn
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/scttfrdmn/inkcap
    description: Markdown to typeset PDF in one static binary.
    license: Apache-2.0
    directory: Casks
    binaries:
      - inkcap
    skip_upload: auto # prerelease tags don't move the tap
    # No quarantine-stripping hook: the darwin binaries are Developer ID signed
    # and notarized (notarize: below), so Gatekeeper lets them run as downloaded.

scoops:
  - name: inkcap
    repository:
      owner: scttfrdmn
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/scttfrdmn/inkcap
    description: Markdown to typeset PDF in one static binary.
    license: Apache-2.0

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "merge conflict"
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
